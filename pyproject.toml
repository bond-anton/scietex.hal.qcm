[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scietex.hal.qcm"
dynamic = ["version"]
description = "Scietex Quartz Microbalance HAL package"
authors = [{ name = "Anton Bondarenko", email = "bond.anton@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  "msgspec[yaml] ~= 0.20.0",
  "scietex.hal.serial >= 2.4.0, < 3.0.0",
  "pymodbus ~= 3.15",
]

[project.entry-points."scietex.hal.qcm.drivers"]
cyky_tm106b_modbus = "scietex.hal.qcm.cyky.tm106b_modbus:TM106BModbus"

[project.urls]
"Homepage" = "https://github.com/bond-anton/scietex.hal.qcm"
"Bug Tracker" = "https://github.com/bond-anton/scietex.hal.qcm/issues"

[project.optional-dependencies]
dev = ["tox>=4.46.0"]
test = ["pytest", "pytest-asyncio", "pytest-xdist"]
lint = ["ruff", "ty"]

[tool.setuptools.dynamic]
version = { attr = "scietex.hal.qcm.version.__version__" }

[tool.setuptools.package-data]
"scietex.hal.qcm" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
